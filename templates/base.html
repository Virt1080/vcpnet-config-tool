<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VCPnet Config Tool{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS for Cyberpunk Glassmorphism Theme -->
    <style>
        :root {
            --cyberpunk-bg: #0a0a0a;
            --cyberpunk-surface: #11111a;
            --cyberpunk-border: #00ffff33;
            --cyberpunk-primary: #00ffff;
            --cyberpunk-secondary: #ff00ff;
            --cyberpunk-accent: #ffff00;
            --cyberpunk-text: #e0e0ff;
            --cyberpunk-text-muted: #b0b0c0;
            --glassmorphism-bg: rgba(17, 17, 26, 0.6);
            --glassmorphism-border: rgba(0, 255, 255, 0.3);
            --glassmorphism-shadow: 0 8px 32px 0 rgba(0, 255, 255, 0.15);
        }

        body {
            background-color: var(--cyberpunk-bg);
            color: var(--cyberpunk-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: var(--glassmorphism-bg) !important;
            backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid var(--glassmorphism-border);
            box-shadow: var(--glassmorphism-shadow);
        }

        .navbar-brand, .nav-link {
            color: var(--cyberpunk-primary) !important;
            font-weight: 500;
        }

        .navbar-brand:hover, .nav-link:hover {
            color: var(--cyberpunk-accent) !important;
        }

        .btn-outline-primary {
            color: var(--cyberpunk-primary);
            border-color: var(--cyberpunk-primary);
            background: transparent;
        }

        .btn-outline-primary:hover {
            background: var(--cyberpunk-primary);
            color: var(--cyberpunk-bg);
        }

        .table {
            background: var(--glassmorphism-bg);
            backdrop-filter: saturate(180%) blur(12px);
            border: 1px solid var(--glassmorphism-border);
            border-radius: 12px;
            box-shadow: var(--glassmorphism-shadow);
            overflow: hidden;
        }

        .table-dark {
            --bs-table-bg: var(--glassmorphism-bg);
            --bs-table-border-color: var(--glassmorphism-border);
            --bs-table-striped-bg: rgba(0, 255, 255, 0.05);
            --bs-table-striped-color: var(--cyberpunk-text);
            --bs-table-active-bg: rgba(0, 255, 255, 0.1);
            --bs-table-hover-bg: rgba(0, 255, 255, 0.075);
            color: var(--cyberpunk-text);
        }

        .table th {
            background: rgba(0, 255, 255, 0.15) !important;
            color: var(--cyberpunk-accent) !important;
            font-weight: 600;
            border-bottom: 2px solid var(--glassmorphism-border);
        }

        .table td {
            border-top: 1px solid var(--glassmorphism-border);
        }

        .form-control, .form-select {
            background: var(--glassmorphism-bg);
            border: 1px solid var(--glassmorphism-border);
            color: var(--cyberpunk-text);
            backdrop-filter: saturate(180%) blur(12px);
        }

        .form-control:focus, .form-select:focus {
            background: var(--glassmorphism-bg);
            border-color: var(--cyberpunk-primary);
            box-shadow: 0 0 0 0.25rem rgba(0, 255, 255, 0.25);
            color: var(--cyberpunk-text);
        }

        .form-control::placeholder {
            color: var(--cyberpunk-text-muted);
        }

        .label {
            color: var(--cyberpunk-text);
            font-weight: 500;
        }

        .alert {
            background: var(--glassmorphism-bg);
            border: 1px solid var(--glassmorphism-border);
            color: var(--cyberpunk-text);
            backdrop-filter: saturate(180%) blur(12px);
        }

        .alert-info {
            background-color: rgba(0, 255, 255, 0.15);
            border-color: var(--glassmorphism-border);
            color: var(--cyberpunk-accent);
        }

        .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--cyberpunk-accent);
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .mb-4, .mt-4 {
            margin-bottom: 1.5rem !important;
            margin-top: 1.5rem !important;
        }

        .container {
            max-width: 1400px;
        }

        /* Cyberpunk animated background effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.1) 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.1) 0%, transparent 25%),
                radial-gradient(circle at 40% 40%, rgba(0, 255, 255, 0.05) 0%, transparent 20%);
            background-size: 200% 200%;
            animation: cyberpunkBG 15s ease infinite;
            pointer-events: none;
            z-index: -2;
        }

        @keyframes cyberpunkBG {
            0% { background-position: 0 0; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0 0; }
        }

        /* Scan line effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 255, 0.05) 2px,
                rgba(0, 255, 255, 0.05) 4px
            );
            pointer-events: none;
            z-index: -1;
            animation: scanLine 4s linear infinite;
        }

        @keyframes scanLine {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* Glassmorphism cards */
        .glassmorphism {
            background: var(--glassmorphism-bg);
            backdrop-filter: saturate(180%) blur(12px);
            border: 1px solid var(--glassmorphism-border);
            border-radius: 16px;
            box-shadow: var(--glassmorphism-shadow);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        /* Status badges */
        .status-badge {
            padding: 0.25em 0.6em;
            border-radius: 0.3em;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-not-loaded {
            background-color: rgba(255, 0, 0, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 0, 0, 0.3);
        }

        .status-config-mismatch {
            background-color: rgba(255, 165, 0, 0.2);
            color: #ffb347;
            border: 1px solid rgba(255, 165, 0, 0.3);
        }

        .status-config-ok {
            background-color: rgba(0, 255, 0, 0.2);
            color: #90ee90;
            border: 1px solid rgba(0, 255, 0, 0.3);
        }

        .status-applying {
            background-color: rgba(0, 191, 255, 0.2);
            color: #64b5f6;
            border: 1px solid rgba(0, 191, 255, 0.3);
        }

        /* Animation for loading states */
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .pulsing {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .table-responsive {
                margin: 0 -1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">VCPnet Config Tool</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('networks') }}">Networks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('devices') }}">Devices</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('management_services') }}">Management</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('known_systems') }}">Known Systems</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('master_template') }}">Master Template</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ request.base_url }}static/js/custom.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
